<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Planner</title>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;background:#101018;color:#f7f4ee}button,input,textarea{font:inherit}.app{min-height:100vh;background:light-dark(#f5efe7,#11111a);color:light-dark(#211d20,#f6f1ea);overflow:hidden}.top{position:fixed;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;z-index:20}.pill,.ghost{border:1px solid #ffffff44;background:#ffffff18;color:inherit;border-radius:999px;padding:9px 14px;backdrop-filter:blur(10px);cursor:pointer}.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:60px 22px}.card{width:min(850px,96vw);padding:44px;border-radius:30px;background:light-dark(#fffaf4,#1b1b25);box-shadow:0 24px 80px #0002;border:1px solid #ffffff18}.center{text-align:center}.eyebrow{letter-spacing:.18em;text-transform:uppercase;font-size:12px;opacity:.65}.title{font-size:clamp(38px,7vw,78px);margin:12px 0}.sub{font-size:18px;opacity:.75}.input{width:100%;padding:17px 20px;border-radius:16px;border:1px solid #8885;background:transparent;color:inherit;outline:none;margin:14px 0}.primary{background:#2e7d57;color:white;border:0;border-radius:16px;padding:14px 22px;cursor:pointer;font-weight:700}.tiny{font-size:12px;opacity:.6}.page{background:#f4e8cf;color:#33291f;width:min(620px,92vw);padding:42px;border-radius:8px;box-shadow:0 25px 70px #0007;transform:rotate(-2deg);animation:float 2.8s ease-in-out infinite}.stick{position:relative;width:150px;height:210px;margin:0 auto 24px}.head{position:absolute;width:48px;height:48px;border:4px solid currentColor;border-radius:50%;left:51px;top:0}.body{position:absolute;width:5px;height:92px;background:currentColor;left:74px;top:48px}.limb{position:absolute;width:5px;height:65px;background:currentColor;transform-origin:top}.a1{left:74px;top:58px;transform:rotate(55deg)}.a2{left:75px;top:58px;transform:rotate(-55deg)}.l1{left:74px;top:137px;transform:rotate(28deg)}.l2{left:75px;top:137px;transform:rotate(-28deg)}.book{position:absolute;width:48px;height:13px;background:#a85a3a;border:2px solid #542f28;right:2px;top:78px;transform:rotate(-18deg);animation:walk 1s infinite alternate}.book.b2{top:94px;right:0;background:#5576a4;transform:rotate(8deg)}.book.b3{top:110px;right:7px;background:#c49a4b;transform:rotate(-5deg)}@keyframes walk{to{transform:translateY(-3px) rotate(18deg)}}@keyframes float{50%{transform:translateY(-12px) rotate(2deg)}}.fall{animation:fall 1.4s forwards}@keyframes fall{to{transform:translateY(85px) rotate(45deg);opacity:.2}}.page.fly{animation:pagefly 1.4s forwards}@keyframes pagefly{to{transform:scale(1.15) translateY(-80px) rotate(0);box-shadow:0 30px 100px #0009}}.bar{height:16px;background:#8883;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:#7b4ca8;transition:width .2s}.clouds{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:28px 0}.cloud{padding:15px 23px;border-radius:999px;background:#e9e3f3;color:#292132;box-shadow:0 9px 20px #0002}.subjects{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}.subject{padding:15px 18px;border-radius:16px;background:#6f5a8e;color:white;cursor:grab}.dragarea{min-height:140px;border:2px dashed #8886;border-radius:20px;padding:14px}.day{flex:1;min-width:90px;min-height:150px;border-radius:22px;background:#ffffff12;padding:12px}.week{display:flex;gap:10px;overflow:auto}.level{padding:18px;border-radius:20px;background:#ffffff12;margin:12px 0}.progress{height:14px;background:#7775;border-radius:9px;overflow:hidden;display:flex}.red{background:#b43d45}.green{background:#39a96b}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.hidden{display:none}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#17171f;color:#fff;padding:12px 18px;border-radius:999px;z-index:50}.bridge{display:flex;gap:4px;align-items:center;justify-content:center;margin:30px 0}.brick{height:35px;flex:1;max-width:70px;background:#3b3b3b;border-radius:5px}.brick.done{background:#45a66c}.mascot{font-size:30px}.spark{animation:spark 1s ease-out forwards}@keyframes spark{to{transform:translateY(-80px) scale(0);opacity:0}}@media(max-width:650px){.card{padding:26px}.week{flex-direction:column}.day{min-height:100px}}
 </style></head><body><div class="app" id="app"></div><script>
const KEY='study_planner_v2';const DAYS=['MON','TUE','WED','THU','FRI','SAT','SUN'];
const fresh=()=>({name:'',goal:'',subjects:[],chapters:{},start:'',end:'',priorities:{},schedule:Object.fromEntries(DAYS.map(d=>[d,[]])),perDay:{},levels:1,levelsDone:0,currentLevel:1,stage:1,progress:[],screen:'name',introSeen:false,finalShown:false});
let state=fresh();try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old)state={...state,...old}}catch(e){}
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const words=s=>String(s||'').trim()?String(s).trim().split(/\s+/).length:0;const chaptersFor=x=>(state.chapters[x]||[]);const allChapters=()=>state.subjects.flatMap(x=>chaptersFor(x).map(c=>({subject:x,chapter:c})));
function go(screen){state.screen=screen;save();render()}
function header(){return `<div class="top"><button class="pill" onclick="go('levels')">🐛 Caterpillar</button><button class="pill" onclick="openMenu()">☰ Menu</button></div>`}
function render(){let s=state.screen,html=header();
if(s==='name')html+=`<section class="screen"><div class="card center"><div class="eyebrow">STUDY PLANNER • BEGIN YOUR JOURNEY</div><div class="mascot">🐛</div><h1 class="title">Welcome, ${state.name?esc(state.name):'future you'}.</h1><p class="sub">What should Caterpillar call you?</p><input id="name" class="input" maxlength="40" value="${esc(state.name)}" placeholder="Your name"><button class="primary" onclick="setName()">Begin →</button>${state.name?'<br><br><button class="ghost" onclick="go(\'levels\')">Open saved planner</button>':''}</div></section>`;
else if(s==='intro')html+=`<section class="screen"><div class="center"><div class="stick"><div class="head"></div><div class="body"></div><div class="limb a1"></div><div class="limb a2"></div><div class="limb l1"></div><div class="limb l2"></div><div class="book"></div><div class="book b2"></div><div class="book b3"></div></div><div class="page"><div class="eyebrow">A page from your journey</div><h2>What is your set goal?</h2><input id="goal" class="input" maxlength="180" value="${esc(state.goal)}" placeholder="NEET-2027 (I want to score 700+ and AIR rank under 100)"><div class="tiny">Maximum 20 words • <span id="wc">${words(state.goal)}</span>/20</div><br><button class="primary" onclick="setGoal()">Set my goal</button></div><br><button class="ghost" onclick="skipIntro()">Skip intro</button></div></section>`;
else if(s==='loading')html+=`<section class="screen"><div class="card center"><div class="mascot">🐛</div><h2>Loading your goal............</h2><div class="bar"><div id="fill" class="fill"></div></div><p class="sub">Caterpillar is building your first step.</p></div></section>`;
else if(s==='subjects')html+=`<section class="screen"><div class="card"><div class="eyebrow">Step 02</div><h1>Let's create a planner!</h1><p class="sub">What are your subjects or book groups? Press Enter after each one.</p><input id="subj" class="input" placeholder="Physics"><div class="subjects">${state.subjects.map((x,i)=>`<div class="subject">${esc(x)} <span role="button" onclick="removeSubject(${i})">×</span></div>`).join('')}</div><div class="tiny">${state.subjects.length}/25 blocks</div><br><button class="primary" ${state.subjects.length?'':'disabled'} onclick="go('chapters')">Continue →</button></div></section>`;
else if(s==='chapters')html+=`<section class="screen"><div class="card"><div class="eyebrow">Step 03</div><h1>Build your chapter lists</h1><p class="sub">Add one chapter per line. You can also use the upload controls as a placeholder for OCR input; imported text can be pasted into the matching box.</p>${state.subjects.map((x,i)=>`<div class="level"><h3>${esc(x)}</h3><textarea id="ch${i}" class="input" rows="5" maxlength="10000" placeholder="Chapter 1\nChapter 2\nChapter 3">${esc(chaptersFor(x).join('\n'))}</textarea><div class="tiny">${chaptersFor(x).length} chapters • max 10,000 words</div><input type="file" accept="image/*" multiple onchange="fileNotice(this,'${esc(x)}')"><input type="file" accept="application/pdf" multiple onchange="fileNotice(this,'${esc(x)}')"><div id="file-${i}" class="tiny"></div></div>`).join('')}<button class="primary" onclick="saveChapters();go('dates')">Continue →</button></div></section>`;
else if(s==='dates')html+=`<section class="screen"><div class="card"><div class="eyebrow">Step 04</div><h1>Choose your journey dates</h1><label>Preferred starting date</label><input id="start" type="date" class="input" value="${esc(state.start)}"><label>Preferred ending date</label><input id="end" type="date" class="input" value="${esc(state.end)}"><button class="primary" onclick="saveDates()">Continue →</button></div></section>`;
else if(s==='priority')html+=`<section class="screen"><div class="card"><div class="eyebrow">Step 05</div><h1>Set your priorities</h1><p class="sub">Rank chapters from highest to lowest priority. The planner will balance workload while respecting this order.</p>${state.subjects.map((x,i)=>`<div class="level"><h3>${esc(x)}</h3><textarea id="pr${i}" class="input" rows="5" placeholder="1. Highest priority\n2. Next\n3. ...">${esc((state.priorities[x]||chaptersFor(x)).join('\n'))}</textarea></div>`).join('')}<button class="primary" onclick="savePriority();go('week')">Continue →</button></div></section>`;
else if(s==='week')html+=`<section class="screen"><div class="card"><div class="eyebrow">Step 06</div><h1>Build your week</h1><div class="clouds">${DAYS.map(d=>`<div class="cloud">${d}</div>`).join('')}</div><p class="sub">Drag the scattered subject blocks into suitable days. You get 20 blocks per subject.</p><div class="subjects" id="pool">${state.subjects.flatMap((x,si)=>Array.from({length:20},(_,i)=>`<div draggable="true" class="subject drag" data-s="${si}" data-i="${i}">${esc(x)} · ${i+1}</div>`)).join('')}</div><div class="week">${DAYS.map(d=>`<div class="day" data-day="${d}"><b>${d}</b><div class="dropzone">${(state.schedule[d]||[]).map((v,i)=>`<div class="subject mini">${esc(v)} <span onclick="removeScheduled('${d}',${i})">×</span></div>`).join('')||'<div class="tiny">Drop blocks here</div>'}</div></div>`).join('')}</div><br><button class="primary" onclick="lockIn()">🔒 LOCK IN</button></div></section>`;
else if(s==='blocks')html+=`<section class="screen"><div class="card"><div class="eyebrow">Step 07</div><h1>How many chapters per block?</h1><p class="sub">Enter the number <b>per subject per day</b>. The planner will distribute the chapters intelligently across your dates.</p>${state.subjects.map((x,i)=>`<div class="level"><h3>${esc(x)}</h3><input class="input" type="number" min="1" max="50" value="${state.perDay[x]||1}" id="num${i}"></div>`).join('')}<button class="primary" onclick="makePlan()">Create my plan →</button></div></section>`;
else if(s==='alchemy')html+=`<section class="screen"><div class="card center alchemy"><div class="eyebrow">THE PLANNER LABORATORY</div><h1>Mixing your preparation...</h1><div class="lab"><span>🔨</span><span>🧫</span><span>🧪</span><span>🟣</span></div><p class="sub">Your priorities, dates and workload are being combined.</p><div class="bar"><div id="alchemy" class="fill"></div></div></div></section>`;
else if(s==='game')html+=`<section class="screen game"><div class="stars">${Array.from({length:50},(_,i)=>`<i style="left:${(i*29)%100}%;top:${(i*47)%90}%">·</i>`).join('')}</div><div class="center"><h1 class="title eerie">WANT TO PLAY A GAME?</h1><button class="primary" onclick="go('levels')">Enter →</button></div></section>`;
else if(s==='levels')html+=levelsPage();
else if(s==='stage')html+=stagePage();
else if(s==='final')html+=`<section class="screen final"><div class="confetti">🎉 ✨ 🎊 ✨ 🎉</div><div class="card center"><div class="mascot">🐛 🎁</div><h1>CONGRATS!</h1><p>You have completed it all, thanks for your hardwork.</p><p>Your exam will definitely go well and you will achieve your goal with flying colours. All the best to you for your future... You have come until here; do not give up or slack up till you get your goal. Keep up the good work!</p><p><b>— Best wishes from Caterpillar 🐛</b></p><button class="primary" onclick="go('levels')">See your bridge →</button></div></section>`;
else if(s==='fullplan')html+=fullPlanPage();
app.innerHTML=html;wire();}
function levelsPage(){const n=Math.max(1,state.levels),done=state.levelsDone||0;return `<section class="screen"><div class="card"><div class="eyebrow">YOUR JOURNEY</div><h1>LEVEL MAP</h1><p class="sub">${esc(state.goal||'Your goal')} </p><div class="bridge">${Array.from({length:n},(_,i)=>`<div class="brick ${i<done?'done':''}" title="Level ${i+1}"></div>`).join('')}</div><div class="tiny center">${done}/${n} levels completed</div>${Array.from({length:n},(_,i)=>`<div class="level"><b>LEVEL-${String(i+1).padStart(2,'0')}</b><div class="tiny">BATCH-${String(i+1).padStart(2,'0')} • 7 STAGES</div><button class="ghost" onclick="openLevel(${i+1})">Open level →</button></div>`).join('')}<div class="nav"><button class="ghost" onclick="go('fullplan')">Full plan</button><button class="ghost" onclick="editPlan()">Edit plan</button></div>${done===n?'': '<p class="tiny">Complete all 7 stages in a level to add its brick to the bridge.</p>'}${done===n?`<div class="center"><div class="mascot">🧍 → 🎁</div><button class="primary" onclick="openGift()">Open final gift</button></div>`:''}</div></section>`}
function stagePage(){const targets=state.currentTargets||[];return `<section class="screen"><div class="card"><div class="eyebrow">LEVEL-${String(state.currentLevel).padStart(2,'0')} • BATCH-${String(state.currentLevel).padStart(2,'0')}</div><h1>STAGE-${String(state.stage).padStart(2,'0')}</h1><p class="sub">Double-click a day in the full plan or use this stage to complete today's targets.</p>${targets.length?targets.map((t,i)=>`<div class="level"><b>${esc(t.subject)} — ${esc(t.chapter)}</b><div class="tiny">THEORY · QUESTIONS · MOCK TEST</div><div class="progress" onclick="toggleProgress(${i})"><div class="green" style="width:${state.progress[i]===1?100:0}%"></div><div class="red" style="width:${state.progress[i]===2?100:0}%"></div></div><div class="tiny">${state.progress[i]===1?'GREEN • COMPLETED':state.progress[i]===2?'RED • UNCOMPLETE':'Click to mark completed; click again to mark uncomplete.'}</div></div>`).join(''):'<p>No targets were generated for this stage.</p>'}<div class="center"><div class="mascot">🧍 → 🟩</div><button class="primary" onclick="completeStage()">${state.stage===7?'Finish level →':'Complete stage →'}</button></div></div></section>`}
function fullPlanPage(){return `<section class="screen"><div class="card"><div class="eyebrow">FULL PLAN</div><h1>${esc(state.name)}'s Study Planner</h1>${DAYS.map(d=>`<div class="level"><h3>${d}</h3>${(state.schedule[d]||[]).map((x,i)=>`<div class="subject mini">${esc(x)}</div>`).join('')||'<div class="tiny">No blocks assigned</div>'}</div>`).join('')}<button class="primary" onclick="go('levels')">Back to levels</button></div></section>`}
function wire(){if(state.screen==='intro'){const g=document.getElementById('goal');g?.addEventListener('input',()=>{document.getElementById('wc').textContent=words(g.value)})}if(state.screen==='subjects'){document.getElementById('subj')?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addSubject(e.target.value)}})}if(state.screen==='week'){document.querySelectorAll('.drag').forEach(el=>el.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',el.dataset.s+'|'+el.dataset.i)));document.querySelectorAll('.day').forEach(day=>{day.addEventListener('dragover',e=>e.preventDefault());day.addEventListener('drop',e=>{e.preventDefault();const [si,bi]=e.dataTransfer.getData('text/plain').split('|');const value=`${state.subjects[+si]} · block ${+bi+1}`;if((state.schedule[day.dataset.day]||[]).length<20)state.schedule[day.dataset.day].push(value);save();render()})})}}
function setName(){const v=document.getElementById('name').value.trim();if(!v)return alert('Please enter your name.');state.name=v;state.screen='intro';save();render()}
function setGoal(){const v=document.getElementById('goal').value.trim();if(!v)return alert('Please enter a goal.');if(words(v)>20)return alert('Please keep your goal within 20 words.');state.goal=v;state.introSeen=true;state.screen='loading';save();render();let n=0;const t=setInterval(()=>{n+=2;const f=document.getElementById('fill');if(f)f.style.width=n+'%';if(n>=100){clearInterval(t);setTimeout(()=>go('subjects'),400)}},200)}
function skipIntro(){state.introSeen=true;go('subjects')}
function addSubject(v){v=v.trim();if(!v)return;if(state.subjects.length>=25)return alert('Maximum 25 subject/book blocks.');if(state.subjects.some(x=>x.toLowerCase()===v.toLowerCase()))return alert('That subject is already added.');state.subjects.push(v);state.chapters[v]=state.chapters[v]||[];save();render()}
function removeSubject(i){const x=state.subjects[i];state.subjects.splice(i,1);delete state.chapters[x];delete state.priorities[x];delete state.perDay[x];save();render()}
function saveChapters(){state.subjects.forEach((x,i)=>{const text=document.getElementById('ch'+i).value;state.chapters[x]=text.split(/\n+/).map(v=>v.trim()).filter(Boolean)})}
function fileNotice(input,x){const imgs=[...input.files].filter(f=>f.type.startsWith('image/'));const pdfs=[...input.files].filter(f=>f.type==='application/pdf');if(imgs.length>12)return alert('Maximum 12 images at a time.');if(pdfs.length>2)return alert('Maximum 2 PDFs at a time.');alert('Files selected for '+x+'. In the full OCR build, their chapter text will be scanned and inserted here. For this prototype, paste the scanned text into the chapter box.')}
function saveDates(){const a=document.getElementById('start').value,b=document.getElementById('end').value;if(!a||!b)return alert('Please choose both dates.');if(new Date(b)<new Date(a))return alert('End date must be after the start date.');state.start=a;state.end=b;go('priority')}
function savePriority(){state.subjects.forEach((x,i)=>state.priorities[x]=document.getElementById('pr'+i).value.split(/\n+/).map(v=>v.trim()).filter(Boolean));go('week')}
function lockIn(){const assigned=Object.values(state.schedule).reduce((a,v)=>a+v.length,0);if(!assigned)return alert('Drag at least one block into the week before locking in.');go('blocks')}
function makePlan(){state.subjects.forEach((x,i)=>state.perDay[x]=Math.max(1,+document.getElementById('num'+i).value||1));const days=Math.floor((new Date(state.end)-new Date(state.start))/86400000)+1;state.levels=Math.max(1,Math.ceil(days/7));state.levelsDone=0;state.currentLevel=1;state.stage=1;state.progress=[];go('alchemy');let n=0;const t=setInterval(()=>{n+=4;const f=document.getElementById('alchemy');if(f)f.style.width=n+'%';if(n>=100){clearInterval(t);setTimeout(()=>go('game'),500)}},80)}
function buildTargets(level,stage){const pool=[];state.subjects.forEach(subject=>{const ranked=(state.priorities[subject]&&state.priorities[subject].length?state.priorities[subject]:chaptersFor(subject));const count=state.perDay[subject]||1;for(let j=0;j<count;j++){const idx=((level-1)*7+(stage-1))*count+j;if(ranked[idx])pool.push({subject,chapter:ranked[idx].replace(/^\d+[.)-]?\s*/, '')})}});return pool}
function openLevel(n){state.currentLevel=n;state.stage=1;state.currentTargets=buildTargets(n,1);state.progress=state.currentTargets.map(()=>0);go('stage')}
function toggleProgress(i){state.progress[i]=state.progress[i]===1?2:1;save();render()}
function completeStage(){if(!state.currentTargets?.length)return alert('There are no generated targets for this stage.');if(state.progress.some(v=>v!==1))return alert('Every target must be GREEN before you proceed.');if(state.stage<7){state.stage++;state.currentTargets=buildTargets(state.currentLevel,state.stage);state.progress=state.currentTargets.map(()=>0);save();render();return}state.levelsDone=Math.max(state.levelsDone||0,state.currentLevel);if(state.currentLevel<state.levels){state.currentLevel++;state.stage=1;state.currentTargets=buildTargets(state.currentLevel,1);state.progress=state.currentTargets.map(()=>0);save();render()}else{state.finalShown=true;go('final')}}
function openGift(){go('final')}
function editPlan(){const step=prompt('Which step do you want to edit?\n1 Goal\n2 Subjects\n3 Chapters\n4 Dates\n5 Priorities\n6 Weekly arrangement\n7 Chapters per block');const map={'1':'intro','2':'subjects','3':'chapters','4':'dates','5':'priority','6':'week','7':'blocks'};if(map[step])go(map[step])}
function openMenu(){const choice=prompt('MENU\n1 Dashboard / Levels\n2 Full plan\n3 Edit plan\n4 Reset planner');if(choice==='1')go('levels');else if(choice==='2')go('fullplan');else if(choice==='3')editPlan();else if(choice==='4'&&confirm('Reset all saved planner data?')){localStorage.removeItem(KEY);state=fresh();render()}}
render();
</script></body></html>
